name: Publish npm distribution

# Builds the offline-installable npm tarball: the specify-cli wheel plus every
# runtime dependency, vendored for each supported platform and CPython version.
#
# Pushing a `vX.Y.Z` tag runs this end to end, publish included. The trigger is
# the tag itself, not the GitHub Release: that release is created by another
# workflow using GITHUB_TOKEN, and events caused by GITHUB_TOKEN can be
# suppressed from starting further runs — a chain that would silently never
# publish. The manual form defaults to a dry run so dispatching it cannot
# publish by accident. The target registry comes from the NPM_REGISTRY
# repository variable and defaults to the public one; an internal mirror is the
# same workflow with that variable pointed at the mirror.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (e.g., v1.0.13)'
        required: true
        type: string
      registry:
        description: 'Registry URL override (empty = NPM_REGISTRY, else public npm)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Stop before publishing and only report the packed contents'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# A tag push and a manual dispatch of the same tag must not publish twice.
concurrency:
  group: publish-npm-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The tag must name the release pyproject.toml carries, or the npm package
      # and the PyPI wheel of one release would disagree. to_semver() is the
      # translation the packaging script itself applies, so a version npm cannot
      # express fails here rather than during `npm publish`.
      - name: Resolve release and publish target
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, ".github/scripts")
          import build_npm_package as builder

          # On a tag push, the tag is the ref itself; a dispatch passes it in.
          if os.environ["EVENT_NAME"] == "push":
              tag = os.environ["PUSHED_REF"].removeprefix("refs/tags/")
          else:
              tag = os.environ["INPUT_TAG"]
          if not tag:
              sys.exit("no release tag: the event carried neither a tag ref nor an input")

          pep440, _requires = builder.pyproject_versions()
          if tag.lstrip("vV") != pep440:
              sys.exit(f"tag {tag} does not match pyproject version {pep440}")

          semver = builder.to_semver(pep440)
          # A prerelease published under `latest` would become what every plain
          # `npm install -g` resolves to.
          dist_tag = "next" if "-" in semver else "latest"
          publish = os.environ["EVENT_NAME"] == "push" or os.environ["DRY_RUN"] != "true"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"dist_tag={dist_tag}\n")
              handle.write(f"publish={'true' if publish else 'false'}\n")
          print(f"{tag} -> npm {semver}, dist-tag {dist_tag}, publish={publish}")
          PY

  # Wheels with native extensions resolve for the machine that downloads them,
  # so every (OS, CPython) cell must run on that platform itself.
  vendor:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Vendor wheels for this platform
        run: python .github/scripts/build_npm_package.py download-vendor

      - name: Upload vendor set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-${{ matrix.os }}-${{ matrix.python }}
          path: npm/vendor/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Merging nine vendor sets re-creates the full platform matrix. Native
      # wheels carry the platform tag in their filename, so cells never share a
      # name; pure wheels repeat across cells and simply overwrite each other
      # with identical bytes from the same index.
      - name: Merge vendor sets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vendor-*
          path: npm/vendor/
          merge-multiple: true

      - name: Assemble npm package
        run: python .github/scripts/build_npm_package.py assemble

      # The gate: a matrix cell that produced nothing, or a vendor tree that
      # drifted from the manifest, stops here instead of reaching the registry.
      - name: Verify support matrix and integrity
        run: python .github/scripts/build_npm_package.py check

      - name: Report the packed contents
        run: npm pack --dry-run
        working-directory: npm

      - name: Pack tarball
        if: needs.validate.outputs.publish == 'true'
        run: |
          python .github/scripts/build_npm_package.py pack
          sha256sum dist/*.tgz > dist/npm-tarball.sha256

      - name: Upload tarball for offline transfer
        if: needs.validate.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: |
            dist/*.tgz
            dist/npm-tarball.sha256
          if-no-files-found: error

  publish:
    needs: [validate, package]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: dist/

      - name: Publish
        env:
          NPM_REGISTRY: ${{ inputs.registry || vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_AUTH_TOKEN}" ]; then
            echo "::error::NPM_AUTH_TOKEN is not set; refusing to publish anonymously."
            echo "Add a CI/CD automation token for ${NPM_REGISTRY} as the repository"
            echo "secret NPM_AUTH_TOKEN, or dispatch this workflow with dry_run=true."
            exit 1
          fi
          # npm keys credentials per registry path: //host/and/path/:_authToken
          host_path="${NPM_REGISTRY#*://}"
          host_path="${host_path%/}"
          umask 077
          printf 'registry=%s\n//%s/:_authToken=%s\n' \
            "${NPM_REGISTRY}" "${host_path}" "${NPM_AUTH_TOKEN}" > "${RUNNER_TEMP}/.npmrc"
          npm publish --registry "${NPM_REGISTRY}" --userconfig "${RUNNER_TEMP}/.npmrc" \
            --tag "${DIST_TAG}" dist/*.tgz
