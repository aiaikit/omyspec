name: CI

on:
  push:
    branches: [main]
    paths: [specify-go/**]
  pull_request:
    paths: [specify-go/**]

defaults:
  run:
    working-directory: specify-go

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: specify-go/go.sum
      - name: go mod download
        run: go mod download
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...